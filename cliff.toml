# git-cliff configuration
# Docs: https://git-cliff.org/docs/configuration
#
# Before using: replace <REPO_URL> below with your repository URL,
# e.g. https://github.com/acme/widget  or  https://gitlab.com/acme/widget

[changelog]
# Text at the very top of CHANGELOG.md, above all releases.
header = """
# Changelog

All notable changes to this project are documented in this file.
The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""

# Rendered once per release. Tera template (Jinja2-compatible).
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.breaking %}**BREAKING** {% endif %}\
{% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
{{ commit.message | upper_first }}\
 ([{{ commit.id | truncate(length=7, end="") }}](<REPO_URL>/commit/{{ commit.id }}))\
{%- if commit.breaking and commit.breaking_description and commit.breaking_description != commit.message %}
  - {{ commit.breaking_description | upper_first }}
{%- endif %}
{%- endfor %}
{% endfor %}
"""

# Text at the very bottom of the file, after all releases.
footer = """
<!-- generated by git-cliff -->
"""

# Strip leading/trailing whitespace from header, body and footer.
trim = true

# Applied to the fully rendered changelog.
postprocessors = [
  # Uncomment and set your repo URL, then delete the placeholder line below.
  # { pattern = '<REPO_URL>', replace = "https://github.com/acme/widget" },
]

[git]
# Parse commits according to the Conventional Commits spec.
conventional_commits = true

# false = non-conventional commits still appear (grouped by the catch-all
# parser below). Flip to true once your history is clean and you want
# anything unparseable silently dropped.
filter_unconventional = false

# Split a commit into multiple entries on this separator. Useful for squash
# merges where the body contains a bullet list of the original commits.
split_commits = false

# Regex applied to each commit message *before* parsing.
commit_preprocessors = [
  # Turn "(#123)" into a link. Adjust the path for GitLab (/-/merge_requests/).
  { pattern = '\\((\\w+\\s)?#([0-9]+)\\)', replace = "([#${2}](<REPO_URL>/pull/${2}))" },
  # Collapse trailing whitespace.
  { pattern = ' +$', replace = "" },
]

# Order matters: the first matching parser wins.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactor" },
  { message = "^doc", group = "<!-- 4 -->Documentation" },
  { message = "^revert", group = "<!-- 5 -->Reverted" },

  # Housekeeping — parsed for versioning, hidden from the changelog.
  { message = "^(chore|ci|build|test|style)", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^Merge", skip = true },
  { message = "^Bump version", skip = true },

  # Anything else that isn't conventional. Remove this line if you set
  # filter_unconventional = true above.
  { message = ".*", group = "<!-- 9 -->Other" },
]

# When true, a commit marked breaking is kept even if a parser would skip it.
protect_breaking_commits = true

# Exclude commits that no parser matched.
filter_commits = false

# Only treat tags matching this as releases. Adjust if you don't prefix with v,
# or if you use monorepo prefixes like "api/v1.2.3".
tag_pattern = "v[0-9].*"

# Tags to exclude entirely (e.g. release candidates).
# skip_tags = "v0.1.0-beta.1"
# ignore_tags = ".*-rc.*"

# Sort tags by topology rather than date. Useful with long-lived branches.
topo_order = false

# "oldest" or "newest" — order of commits within each group.
sort_commits = "oldest"

[bump]
# feat: always bumps minor, even on 0.x.
features_always_bump_minor = true

# IMPORTANT on 0.x: true means a breaking change takes you 0.4.2 -> 1.0.0.
# Set false if you want to stay on 0.x until you deliberately declare 1.0.
breaking_always_bump_major = true

# Version used when no tags exist yet.
initial_tag = "v0.1.0"